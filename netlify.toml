# Netlify configuration for jonbjorkmusic.com

# /pro now redirects to The Practice Room sales page (2026-08-11 front-door
# restructure). EXACT PATH ONLY, no wildcard: /practiceroom loads its images
# from /pro/assets/, which must keep serving. force = true because the old
# pro/index.html still exists in the repo.
[[redirects]]
  from = "/pro"
  to = "/practiceroom"
  status = 301
  force = true

# Channel short links -> The Practice Room on Skool (2026-08-26).
# One path per channel so each shows up separately in analytics.
# 302 (not 301) so browsers do not cache them permanently and the
# destination can be changed later without stale redirects.
[[redirects]]
  from = "/yt"
  to = "https://www.skool.com/thepracticeroom"
  status = 302
  force = true

[[redirects]]
  from = "/ig"
  to = "https://www.skool.com/thepracticeroom"
  status = 302
  force = true

# Short link for the picking workout sales page, for video descriptions and
# posts. The page itself lives at /alternate-picking-workout; the APP is at
# /picking-workout, which is where a buyer's licence key gets used.
[[redirects]]
  from = "/apw"
  to = "/alternate-picking-workout"
  status = 302
  force = true
#
# Strategy:
# 1. Run Eleventy in the notes/ folder, which generates notes/_site/
# 2. Copy the existing site files into a build/ folder
# 3. Drop the generated notes pages into build/notes/
# 4. Publish build/ as the live site
# Serverless functions. This is Netlify's default location, declared here so
# it is obvious that netlify/ is BUILD INPUT, not site content. The publish
# rsync below excludes it: without that exclusion every function's source is
# served as a static file (it was, until 2026-08-29), which would put the
# picking-warmup routine data on a public URL and defeat its licence gate.
[functions]
  directory = "netlify/functions"
  # The workbook PDF is bundled INTO the function rather than published, so
  # picking-workout-workbook.js can hand it out only to a valid licence key.
  included_files = ["netlify/assets/**"]

[build]
  publish = "build"
  command = """
    cd notes && npm install && npx @11ty/eleventy && cd .. && \
    mkdir -p build && \
    rsync -a --exclude='notes' --exclude='build' --exclude='.git' --exclude='node_modules' --exclude='.DS_Store' --exclude='admin' --exclude='netlify' ./ build/ && \
    cp -r admin build/admin && \
    rsync -a notes/_site/notes/ build/notes/ && \
    if [ -d notes/_site/licks ]; then mkdir -p build/licks && rsync -a notes/_site/licks/ build/licks/; fi && \
    if [ -d notes/_site/alternate-picking ]; then mkdir -p build/alternate-picking && rsync -a notes/_site/alternate-picking/ build/alternate-picking/; fi && \
    if [ -d notes/_site/contact ]; then mkdir -p build/contact && rsync -a notes/_site/contact/ build/contact/; fi && \
    if [ -d notes/_site/tabs ]; then mkdir -p build/tabs && rsync -a notes/_site/tabs/ build/tabs/; fi && \
    if [ -d notes/_site/images ]; then rsync -a notes/_site/images/ build/notes/images/; fi && \
    if [ -f notes/_site/sitemap.xml ]; then cp notes/_site/sitemap.xml build/sitemap.xml; fi
  """
